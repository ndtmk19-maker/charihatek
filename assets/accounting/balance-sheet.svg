<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Document paper with ledger lines -->
  <rect x="22" y="16" width="76" height="88" rx="8" fill="#f8fafc" stroke="#166534" stroke-width="3"/>
  <rect x="22" y="16" width="76" height="22" rx="8" fill="#166534"/>
  <rect x="32" y="24" width="30" height="6" rx="2" fill="#ffffff"/>
  
  <!-- Assets vs Liabilities columns -->
  <line x1="60" y1="46" x2="60" y2="92" stroke="#15803d" stroke-width="1.5" stroke-dasharray="3 3"/>
  
  <!-- Left column rows (Assets) -->
  <line x1="30" y1="52" x2="52" y2="52" stroke="#475569" stroke-width="2"/>
  <line x1="30" y1="64" x2="52" y2="64" stroke="#475569" stroke-width="2"/>
  <line x1="30" y1="76" x2="52" y2="76" stroke="#475569" stroke-width="2"/>
  
  <!-- Right column rows (Liabilities & Equity) -->
  <line x1="68" y1="52" x2="90" y2="52" stroke="#475569" stroke-width="2"/>
  <line x1="68" y1="64" x2="90" y2="64" stroke="#475569" stroke-width="2"/>
  <line x1="68" y1="76" x2="90" y2="76" stroke="#475569" stroke-width="2"/>
  
  <!-- Total Double underline -->
  <line x1="28" y1="88" x2="92" y2="88" stroke="#166534" stroke-width="2"/>
  <line x1="28" y1="92" x2="92" y2="92" stroke="#166534" stroke-width="2"/>
</svg>
